esphome:
  name: tclac-test-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

uart:
  id: tclac_test_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

external_components:
  - source:
      type: local
      path: ../components
    components: [tclac]

climate:
  - platform: tclac
    id: tclac_test_climate
    name: TCL AC Test
    turbo_sensor:
      name: TCL AC Test Turbo
    compressor_running:
      name: TCL AC Test Compressor
    evaporator_temperature:
      name: TCL AC Test Evaporator Temperature
    compressor_temperature:
      name: TCL AC Test Compressor Temperature
    compressor_frequency:
      name: TCL AC Test Compressor Frequency
    supply_voltage:
      name: TCL AC Test Supply Voltage
    diagnostic_hex:
      name: TCL AC Test Diagnostic Data

# Aktionen in Triggern mit Argumenten (prüft die play()-Signatur in automation.h)
select:
  - platform: template
    name: Aktionstest
    optimistic: true
    options: ["an", "aus"]
    on_value:
      - climate.tclac.display_on: tclac_test_climate
      - climate.tclac.beeper_off: tclac_test_climate
      - climate.tclac.set_vertical_airflow:
          id: tclac_test_climate
          vertical_airflow: CENTER
      - climate.tclac.set_horizontal_swing_direction:
          id: tclac_test_climate
          horizontal_swing_mode: LEFT_RIGHT
